site_name: Manual PowerShell
site_description: Apostila prática de PowerShell com exemplos executáveis e boas práticas.
site_url: https://dosciati.github.io/Manual-PowerShell/
repo_name: dosciati/Manual-PowerShell
repo_url: https://github.com/dosciati/Manual-PowerShell
copyright: "© 2025 André Forlin Dosciati"

nav:
  - Início: index.md
  - Guia:
    - PDF Convertido (auto): guia/00_apostila_convertida.md
    - Introdução: guia/01_introducao.md
    - Fundamentos e Básico: guia/02_basico.md
    - Módulos e Pacotes: guia/03_modulos.md
    - Scripting e Automação: guia/04_scripting.md
    - Boas Práticas e Segurança: guia/05_boas_praticas.md
    - Exemplos de Uso: guia/06_exemplos.md
    - Receitas (extra): guia/07_receitas.md
    - Fundamentos (curado): guia/10_fundamentos.md
    - Administração: guia/11_administracao.md
    - Rede: guia/12_rede.md
    - Armazenamento: guia/13_armazenamento.md
    - Segurança: guia/14_seguranca.md
    - Automação: guia/15_automacao.md
  - Exemplos (.ps1):
    - Listar Softwares Instalados: exemplos/Get-InstalledSoftware.ps1
    - Limpar Temporários: exemplos/Clean-Temp.ps1
    - Verificar UAC/Admin: exemplos/Check-UAC.ps1

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
    - toc.integrate

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      locale: pt_BR
  - minify:
      minify_html: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true
